[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voltaic"
# Single source of truth: voltaic/__init__.py
dynamic = ["version"]
description = "Logitech device battery levels in the Linux system tray"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "João Salavisa" }]
keywords = ["logitech", "battery", "tray", "hidpp", "linux", "mx-master"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# No Python dependencies on purpose: the HID++ protocol is spoken directly
# over /dev/hidraw with the standard library. PyGObject, GTK 3 and pycairo
# are needed at runtime but come from the distribution, not from PyPI, so
# they are deliberately not listed here.
dependencies = []

[project.scripts]
voltaic = "voltaic.__main__:main"

[tool.setuptools]
packages = ["voltaic"]

[tool.setuptools.dynamic]
version = { attr = "voltaic.__version__" }

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    # GTK's version negotiation has to run before the imports it guards,
    # so module-level imports legitimately follow other statements.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose — the parsing internals are
# exactly what needs pinning down.
"tests/*" = ["E501"]
