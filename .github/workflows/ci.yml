name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor comes from pyproject's requires-python.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # No GTK is installed on purpose. The protocol and model layers are
      # standard library only, and this run is what proves they stay that
      # way — an accidental top-level `import gi` fails here.
      - name: Run headless unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check the CLI degrades without GTK
        run: |
          python -m voltaic --version
          python -m voltaic --help > /dev/null
          # No receiver on a CI runner, so --list exits 1 having found
          # nothing; it must say so rather than trace back.
          python -m voltaic --list && rc=$? || rc=$?
          test "$rc" -eq 1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Deliberately no setup-python: pycairo comes from apt and lands in
      # the *system* interpreter's dist-packages, so a setup-python runtime
      # would not see it and the cairo tests would quietly skip instead of
      # running. The venv exists only to get coverage alongside them, and
      # --system-site-packages is what keeps cairo visible inside it.
      - name: Install pycairo and GTK
        run: |
          sudo apt-get update -qq
          # xvfb so the settings-window tests actually run here rather than
          # skipping: building a Gtk.Window needs a display, even though
          # nothing is ever shown.
          sudo apt-get install -y -qq python3-gi python3-cairo gir1.2-gtk-3.0 xvfb
          python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/pip install --quiet coverage

      - name: Confirm cairo is importable, so the tests do not skip
        run: .ci-venv/bin/python -c "import cairo; print('pycairo', cairo.version)"

      - name: Confirm a display is available, so no GUI test skips
        run: |
          xvfb-run -a .ci-venv/bin/python -c "
          import gi
          gi.require_version('Gtk', '3.0')
          from gi.repository import Gtk
          assert Gtk.init_check([])[0], 'no display'
          print('display OK')
          "

      - name: Run tests under coverage
        run: xvfb-run -a env PATH="$PWD/.ci-venv/bin:$PATH" make coverage

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting is not wildly off
        run: ruff format --diff . || true

  package:
    name: Build and validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: Validate the desktop entry and udev rules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/voltaic.desktop
          # udevadm verify landed in systemd 254; skip it on older runners.
          if udevadm verify --help > /dev/null 2>&1; then
            udevadm verify packaging/60-voltaic.rules
          fi

  install-script:
    name: install.sh on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:41
            bootstrap: dnf install -y -q git make python3
          - distro: arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm --needed git make python
          - distro: opensuse
            image: opensuse/tumbleweed
            bootstrap: >-
              zypper --non-interactive --quiet install git make python3 ||
              (sleep 20 && zypper --non-interactive refresh --force &&
               zypper --non-interactive --quiet install git make python3)
          - distro: debian
            image: debian:12
            bootstrap: apt-get update -qq && apt-get install -y -qq git make python3
          - distro: ubuntu
            image: ubuntu:24.04
            bootstrap: apt-get update -qq && apt-get install -y -qq git make python3
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap the image
        run: ${{ matrix.bootstrap }}

      - uses: actions/checkout@v5

      # The script names a different set of packages per distribution, and
      # those names drift. openSUSE's "gtk3" shipped no Python typelib, which
      # let the script report success while the tray could not start — the
      # sort of thing only a real run on a real image catches.
      - name: Run the installer
        run: ./install.sh -y

      - name: Check the result actually works
        run: |
          ~/.local/bin/voltaic --version
          ~/.local/share/voltaic/venv/bin/python -c "
          import gi
          gi.require_version('Gtk', '3.0')
          from gi.repository import Gtk
          import cairo
          print('GTK 3 and pycairo usable')
          "

  pkgbuild:
    name: PKGBUILD on Arch
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Sy --noconfirm --needed base-devel git

      - uses: actions/checkout@v5

      # makepkg refuses to run as root, so build as an unprivileged user.
      # A full build (not --nobuild) verifies the source checksum against the
      # real release tarball, so a PKGBUILD whose pkgver and sha256sums have
      # drifted apart fails here rather than for a user.
      - name: Build the package
        run: |
          useradd -m builder
          cp packaging/PKGBUILD /home/builder/
          chown -R builder:builder /home/builder

          # A PKGBUILD names a released tarball, so between bumping pkgver
          # and pushing the tag there is a window where the source does not
          # exist yet. Downloading is skipped there rather than failing the
          # build and blocking the very release that would fix it.
          pkgver=$(su builder -c 'cd ~ && source PKGBUILD && echo "$pkgver"')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${pkgver}"
          if curl -fsS -o /dev/null "$url"; then
            echo "v$pkgver is released — building with checksum verification"
            su builder -c 'cd ~ && makepkg --nodeps --noconfirm'
            su builder -c 'cd ~ && bsdtar -tf voltaic-*.pkg.tar.* | grep -q usr/bin/voltaic'
          else
            echo "::notice::v$pkgver is not released yet;"\
                 "validating the PKGBUILD without downloading it."
            su builder -c 'cd ~ && makepkg --verifysource --skipchecksums --noconfirm' \
              || true
            su builder -c 'cd ~ && source PKGBUILD && test -n "$pkgname" && test -n "$pkgver"'
          fi

      # The AUR rejects a push whose .SRCINFO disagrees with its PKGBUILD,
      # and .SRCINFO is generated rather than written, so it silently rots.
      - name: Check .SRCINFO is in step with the PKGBUILD
        run: |
          su builder -c 'cd ~ && makepkg --printsrcinfo' > /tmp/SRCINFO.generated
          if ! diff -u packaging/.SRCINFO /tmp/SRCINFO.generated; then
            echo "::error::packaging/.SRCINFO is stale."\
                 "Regenerate it with: makepkg --printsrcinfo > packaging/.SRCINFO"
            exit 1
          fi
          echo ".SRCINFO matches the PKGBUILD"

      # The PKGBUILD tracks the last *released* version, so it legitimately
      # lags the working tree between tagging and bumping it. Only the
      # nonsensical direction — packaging a version that does not exist yet
      # — is an error.
      - name: Compare the packaged version with the source
        run: |
          pkgver=$(su builder -c 'cd ~ && source PKGBUILD && echo "$pkgver"')
          srcver=$(python3 -c "
          import re, pathlib
          print(re.search(r'__version__ = \"([^\"]+)\"',
                pathlib.Path('voltaic/__init__.py').read_text()).group(1))
          ")
          echo "PKGBUILD: $pkgver   source: $srcver"
          if [ "$pkgver" = "$srcver" ]; then
            echo "in step"
          elif [ "$(printf '%s\n%s\n' "$pkgver" "$srcver" | sort -V | head -1)" = "$pkgver" ]; then
            echo "::notice::PKGBUILD is at $pkgver while the source is at"\
                 "$srcver. Bump it after tagging v$srcver (see packaging/AUR.md)."
          else
            echo "::error::PKGBUILD is at $pkgver, ahead of the source at"\
                 "$srcver — that version cannot exist."
            exit 1
          fi

  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    # Needed only by the release-upload step on tag builds.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build the package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot lintian appstream
          make deb

      # Policy compliance, which is the bar any apt archive holds a package
      # to. Failing on warnings keeps it at that bar rather than drifting.
      - name: Lintian
        run: lintian --fail-on error,warning --tag-display-limit 0 build/*.deb

      - name: Validate AppStream metadata
        run: appstreamcli validate packaging/org.jcfs.voltaic.metainfo.xml

      # Proves the declared dependencies are satisfiable and the maintainer
      # scripts run — a package that cannot install is worse than none.
      - name: Install it, and check it runs
        run: |
          sudo apt-get install -y ./build/voltaic_*_all.deb
          voltaic --version
          test -f /usr/lib/udev/rules.d/60-voltaic.rules
          test -f /usr/share/icons/hicolor/scalable/apps/voltaic.svg
          test -f /usr/share/man/man1/voltaic.1.gz
          test -f /usr/share/metainfo/org.jcfs.voltaic.metainfo.xml
          man -w voltaic
          # No receiver on a runner, so this exits 1 having found nothing.
          voltaic --list && rc=$? || rc=$?
          test "$rc" -eq 1
          sudo apt-get remove -y voltaic

      - uses: actions/upload-artifact@v4
        with:
          name: voltaic-deb
          path: build/*.deb

      # Tag builds go straight onto the release, so the README's download
      # link is never stale.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" build/*.deb --clobber
